services:
  - type: web
    name: headway-api
    runtime: python
    plan: free
    healthCheckPath: /health
    buildCommand: pip install -r api/requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_DATABASE_URL
        sync: false          # the read-only role; set in the dashboard, never committed
      - key: PYTHON_VERSION
        value: "3.13.1"
